name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Ohne hinterlegte FTP-Secrets wird der Deploy übersprungen statt rot zu werden.
      - name: Deploy via FTP nach /public_html/
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./
          server-dir: /public_html/
          # Niemals Dateien löschen, die nicht im Repo stehen (WordPress, Assets, ki/)
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            wp-*
            wp-*/**
            readme.html
            license.txt
            xmlrpc.php
            .private
            .tmb
            ai/**
            assets/**
            file5.php
            index.php
            .htaccess*

      - name: Hinweis, wenn keine FTP-Zugangsdaten hinterlegt sind
        if: env.FTP_SERVER == ''
        run: echo "::notice::Kein FTP-Secret hinterlegt — Repo ist versioniert, Deploy erfolgt manuell per FTP."
